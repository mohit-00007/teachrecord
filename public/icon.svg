<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Screen Monitor outline -->
  <rect x="80" y="96" width="352" height="232" rx="24" fill="#1e293b" stroke="#475569" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Screen Display Interior -->
  <rect x="96" y="112" width="320" height="200" rx="14" fill="#090d16" />

  <!-- Whiteboard / Presentation Elements inside Screen -->
  <!-- Top bar -->
  <rect x="116" y="132" width="120" height="12" rx="6" fill="#475569" opacity="0.6" />
  <circle cx="396" cy="138" r="6" fill="#10b981" />
  
  <!-- Presentation chart lines -->
  <path d="M120 230 L170 190 L220 210 L280 160 L330 180" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Front Camera Picture-in-Picture Circle -->
  <circle cx="346" cy="242" r="44" fill="#0f172a" stroke="#f43f5e" stroke-width="6" />
  <!-- Avatar icon inside PiP -->
  <circle cx="346" cy="232" r="14" fill="#cbd5e1" />
  <path d="M322 268 C324 252, 368 252, 370 268 Z" fill="#94a3b8" />

  <!-- Monitor Stand -->
  <path d="M226 328 L286 328 L296 384 L216 384 Z" fill="#334155" />
  <rect x="180" y="384" width="152" height="18" rx="9" fill="#475569" />

  <!-- Recording Badge / Live Indicator -->
  <g transform="translate(180, 420)">
    <rect x="0" y="0" width="152" height="42" rx="21" fill="url(#redGrad)" filter="url(#shadow)" />
    <circle cx="28" cy="21" r="7" fill="#ffffff" />
    <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="2">REC LIVE</text>
  </g>
</svg>
